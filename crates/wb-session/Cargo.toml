[package]
name = "wb-session"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "wb-host"
path = "src/bin/wb-host.rs"

[[bin]]
name = "wb-daemon"
path = "src/bin/wb-daemon.rs"

[[bin]]
name = "wb"
path = "src/bin/wb.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console",
  "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes",
  "Win32_System_Threading", "Win32_System_IO", "Win32_System_ProcessStatus",
] }
